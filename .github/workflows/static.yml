# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate Google Analytics report
        env:
          GOOGLE_GA4_CREDENTIALS_JSON: ${{ secrets.GOOGLE_GA4_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: "16357193074"
        run: |
          if [ -z "$GOOGLE_GA4_CREDENTIALS_JSON" ]; then
            echo "GOOGLE_GA4_CREDENTIALS_JSON is not configured; keeping the previous report if one exists."
          else
            # Đảm bảo file credentials.json LUÔN bị xóa kể cả khi lệnh npm bị lỗi
            trap 'rm -f credentials.json' EXIT

            npm ci --no-audit --no-fund
            printf '%s' "$GOOGLE_GA4_CREDENTIALS_JSON" > credentials.json
            GOOGLE_APPLICATION_CREDENTIALS=./credentials.json npm run generate:analytics
          fi

      - name: Clean up node_modules before upload
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
