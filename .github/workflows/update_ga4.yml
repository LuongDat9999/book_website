name: Update GA4 Statistics (Node.js)

on:
  schedule:
    - cron: '0 */2 * * *' # Tự động chạy mỗi 2 giờ
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên giao diện GitHub

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sử dụng phiên bản Node.js ổn định

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run update script
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: node update_stats.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automated update: GA4 statistics (Node.js)" || exit 0
          git push
